name: ci
on:
  push: {}
  pull_request: {}
  workflow_dispatch: {}
jobs:
  ci:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with: { version: latest }
      - run: mise trust
      - run: mise install
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: |
          if grep -R -E "from ['\"]node:|import.*node:" src/domain; then echo "✖ domain imports node:"; exit 1; fi
          echo "✓ domain purity ok"
      - run: pnpm test
      - run: pnpm build
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help
      - if: matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run 2>&1 | grep -q "dist/cli.js" && echo "✓ npm pack contains dist"
      - if: matrix.os == 'ubuntu-latest'
        run: ANI2MAL_CONFIG_DIR=/tmp/ci-test node dist/cli.js sync --dry-run 2>&1 | grep -q "anilist.username"
